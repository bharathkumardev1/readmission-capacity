[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "readmit"
version = "0.1.0"
description = "30-day hospital readmission risk, evaluated at a fixed outreach capacity, on the UCI diabetes data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bharath Mandha" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "xgboost>=2.1",
]

[project.optional-dependencies]
service = ["fastapi>=0.115", "uvicorn>=0.30", "prometheus-client>=0.20", "httpx>=0.27"]
dev = ["pytest>=8.0", "ruff==0.17.1", "readmit[service]"]

[project.scripts]
readmit = "readmit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
