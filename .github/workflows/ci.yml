name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Tests
        run: pytest -q

  reproduce:
    # Downloads the extract from UCI (checked against the pinned SHA-256), retrains with the
    # locked libraries, and fails if the headline numbers move. The UCI zip also brings
    # IDs_mapping.csv, so the reason-code descriptions get checked against it here. Then the
    # browser scorer is checked against the freshly trained model.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: pip install --require-hashes -r requirements.lock && pip install --no-deps -e . && pip install pytest
      - run: readmit run --out ci-results --model-dir ci-artifacts
      - name: Headline numbers match the committed results
        run: |
          python - <<'PY'
          import json
          new = json.load(open("ci-results/metrics.json"))
          old = json.load(open("results/metrics.json"))
          assert new["shipped"]["model"] == old["shipped"]["model"], (new["shipped"], old["shipped"])
          for name in ("LightGBM", "XGBoost", "logistic regression"):
              a, b = new["test"][name], old["test"][name]
              for k in ("auroc", "auprc", "brier"):
                  assert abs(a[k] - b[k]) < 0.002, (name, k, a[k], b[k])
              assert abs(a["top10"]["recall"] - b["top10"]["recall"]) < 0.005, name
          print("reproduced:", {k: round(new["test"]["LightGBM"][k], 4) for k in ("auroc", "auprc", "brier")})
          PY
      - name: Reason-code descriptions against IDs_mapping.csv
        # The official wording of the codes we describe goes on the run summary as a notice, and
        # a failure's assertion as an error, so neither needs the raw log.
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "tests")
          from test_reasons import KEYWORDS, read_mapping
          source = json.loads(Path("data/source.json").read_text())
          print(f"::notice::data from {source['url']}; files: {', '.join(source['files']) or '(not a zip)'}")
          path = Path("data/IDs_mapping.csv")
          if not path.exists():
              print("::error::data/IDs_mapping.csv is missing: the extract didn't come from the UCI zip")
              sys.exit(1)
          official = read_mapping(path)
          # One notice for all codes: GitHub keeps only ten notices per step.
          lines = [f"{col} {code}: {official.get((col, code), '(not in the file)')}" for col, code in KEYWORDS]
          print("::notice::" + "%0A".join(lines))
          PY
          pytest -q tests/test_reasons.py -rs --tb=line -p no:cacheprovider | tee pytest.out
          status=${PIPESTATUS[0]}
          grep -E "^(E |/.*:[0-9]+: )" pytest.out | sed 's/^/::error::/' || true
          exit $status
      - run: readmit export --model-dir ci-artifacts --out web/test/data
      - run: READMIT_RESULTS=../ci-results npm test
        working-directory: web

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Train a small model on synthetic data for the smoke test
        run: python scripts/smoke_model.py /tmp/models
      - run: docker build -t readmit .
      - name: Smoke test
        run: |
          chmod -R a+rX /tmp/models
          docker run -d --name readmit -p 8000:8000 -v /tmp/models:/models:ro readmit
          for i in $(seq 1 30); do curl -fs localhost:8000/healthz && break; sleep 1; done
          curl -fs -X POST localhost:8000/score -H 'content-type: application/json' \
            -d '{"encounters":[{"age":"[70-80)","time_in_hospital":9,"number_inpatient":4}]}' \
            | python3 -c "import json,sys; r=json.load(sys.stdin)['results'][0]; assert r['reasons'], r; print(r)"
          docker logs readmit

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
